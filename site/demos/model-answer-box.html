<div class="demo-stage" data-demo="model-answer-box">
  <div style="max-width:480px">
    <p class="m-quiz-q" style="margin-bottom:12px">「その会議は明日開かれます」を英語にしよう。</p>
    <div class="m-field" style="max-width:none">
      <label class="m-label" for="ma-1">あなたの答え</label>
      <textarea class="m-input" id="ma-1" lang="en" placeholder="例: The meeting ..."></textarea>
    </div>
    <p style="margin:12px 0 0"><button type="button" class="m-btn m-btn--primary" data-check disabled>答え合わせ</button></p>
    <div class="m-model" aria-label="模範解答" hidden>
      <p class="m-model-h">模範解答<button type="button" class="m-speak" aria-label="読み上げる" data-speak="The meeting will be held tomorrow.">🔊</button></p>
      <p class="m-model-text" lang="en">The meeting will be held tomorrow.</p>
    </div>
  </div>
  <p class="demo-note">答えを書いて「答え合わせ」を押すと、入力欄の下に模範解答が出ます。<button type="button" class="demo-reset" data-reset>はじめに戻す</button></p>
</div>

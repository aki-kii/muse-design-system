<div class="demo-stage" data-demo="list-rows">
  <div class="demo-item">
    <p class="demo-cap">予定行</p>
    <div class="m-card">
      <ul class="m-rows">
        <li><span class="m-time">09:30–10:00</span><span class="m-bar" style="background:var(--accent)" aria-hidden="true"></span><span class="m-row-main"><span class="m-row-title">朝のミーティング</span><span class="m-row-sub">オンライン</span></span></li>
        <li><span class="m-time">13:00–14:30</span><span class="m-bar" style="background:var(--dim)" aria-hidden="true"></span><span class="m-row-main"><span class="m-row-title">勉強会</span><span class="m-row-sub">会議室 B</span></span></li>
        <li><span class="m-time">19:00–</span><span class="m-bar" style="background:var(--faint)" aria-hidden="true"></span><span class="m-row-main"><span class="m-row-title">買い出し</span><span class="m-row-sub">駅前のスーパー</span></span></li>
      </ul>
    </div>
  </div>
  <div class="demo-item">
    <p class="demo-cap">タスク行（押すと完了）</p>
    <div class="m-card">
      <ul class="m-rows">
        <li><label class="m-task" style="display:contents"><input type="checkbox" class="m-check"><span class="m-row-main"><span class="m-row-title">会費の振り込み</span><span class="m-row-sub">案内のメールに口座あり</span></span></label><span class="m-due">今週中</span></li>
        <li><label class="m-task" style="display:contents"><input type="checkbox" class="m-check" checked><span class="m-row-main"><span class="m-row-title">資料を送る</span><span class="m-row-sub">担当の方へ</span></span></label><span class="m-due">今日</span></li>
      </ul>
    </div>
  </div>
  <div class="demo-item">
    <p class="demo-cap">数値タイル＋メーター</p>
    <div class="m-card">
      <div class="m-tiles">
        <div class="m-tile"><div class="m-tile-num">8,200<small>歩</small></div><div class="m-tile-label">今日の歩数</div></div>
        <div class="m-tile"><div class="m-tile-num">1.2<small>L</small></div><div class="m-tile-label">飲んだ水</div></div>
        <div class="m-tile"><div class="m-tile-num">7<small>時間</small></div><div class="m-tile-label">睡眠</div></div>
      </div>
      <div class="m-meter" role="progressbar" aria-label="目標の歩数までの進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="82"><span style="width:82%"></span></div>
      <p class="m-row-sub" style="margin:0">目標 10,000 歩まであと 1,800 歩</p>
    </div>
  </div>
</div>

<div class="demo-stage" data-demo="error-recovery">
  <div class="m-card" style="max-width:480px">
    <div class="m-field" style="max-width:none">
      <label class="m-label" for="er-1">問い合わせの内容</label>
      <textarea class="m-input" id="er-1" rows="3" style="height:auto;min-height:92px;padding-top:12px" aria-describedby="er-1-msg">配送の日を変えたいです。</textarea>
      <p class="m-hint" id="er-1-msg" data-msg></p>
    </div>
    <div class="m-btn-row" style="margin-top:12px"><button type="button" class="m-btn m-btn--primary" data-send>送信する</button></div>
  </div>
  <label class="demo-note" style="display:flex;align-items:center;gap:8px;margin-top:12px"><input type="checkbox" data-fail checked> 送信を失敗させる（見本の切り替え。入れている間は毎回失敗する）</label>
  <p class="demo-note">失敗しても入力は消えず、ボタンの近くに理由と次の一手が出て、同じボタンでやり直せます。</p>
</div>

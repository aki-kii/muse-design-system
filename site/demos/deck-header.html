<div class="demo-stage" data-demo="deck-header">
  <div class="demo-item">
    <p class="demo-cap">デッキの上端（再読み込みを押すと回る）</p>
    <div class="m-deck-header" style="max-width:420px;border-radius:var(--radius-row)">
      <button type="button" class="m-round" aria-label="デッキ一覧に戻る" data-toast="一覧へ戻ります">{{i:grid}}</button>
      <span class="m-deck-name">AWS で始める家族の自動化 ― JAWS-UG 茨城支部 #1 の発表資料</span>
      <button type="button" class="m-round" aria-label="スライドを再読み込み" data-refresh>{{i:refresh}}</button>
    </div>
  </div>
  <div class="demo-item">
    <p class="demo-cap">スレッドの上端（完了トグルで解決済みに）</p>
    <div class="m-deck-header" style="max-width:420px;border-radius:var(--radius-row)" data-thread-head>
      <button type="button" class="m-round" aria-label="スレッド一覧に戻る">{{i:back}}</button>
      <span class="m-thread-head-text"><span class="m-thread-head-title">タイトルをもう少し短くしたい</span><span class="m-thread-head-page">1ページ</span></span>
      <button type="button" class="m-done" aria-pressed="false" aria-label="解決済みにする" data-toggle-pressed data-labels="解決済みにする|未解決に戻す">{{i:check}}</button>
      <button type="button" class="m-round" aria-label="スレッドを削除" data-toast="確認ダイアログを開きます">{{i:trash}}</button>
    </div>
  </div>
</div>

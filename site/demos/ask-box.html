<div class="demo-stage" data-demo="ask-box">
  <div class="m-card" style="max-width:520px">
    <p class="m-card-body">受動態は「be動詞＋過去分詞」で作ります。する側より、される側に話の中心があるときに使います。</p>
    <div class="m-ask">
      <p class="m-ask-h">このページについて質問する</p>
      <div class="m-qa" aria-live="polite">
        <div><p class="q">Q. by のあとは必ず書くの？</p><p class="a">A. 誰がしたかが分かっているときや、言う必要がないときは省きます。</p></div>
      </div>
      <label class="vh" for="ask-1">このページについて質問する</label>
      <textarea class="m-input" id="ask-1" placeholder="例: この図は何を表してるの？"></textarea>
      <button type="button" class="m-btn m-btn--primary m-btn--block" aria-label="質問を送る" data-ask disabled>聞く</button>
    </div>
  </div>
  <p class="demo-note">書くと「聞く」が押せるようになり、押すと「聞いてる…」のあとに Q&amp;A が足されます（答えはデモ用の固定の文です）。</p>
</div>

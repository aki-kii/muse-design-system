<template data-type="cover"><div class="m-slide" role="img" aria-label="表紙のスライド: 週末の読書会のふりかえり"><div class="m-slide-in"><span class="s-kicker">まちの勉強会 #1</span><span class="s-title">週末の読書会の<br>ふりかえり</span><span class="s-sub">読んだ本と話した内容をまとめる</span><span class="s-by">ユーザー</span></div></div></template>
<template data-type="section"><div class="m-slide" role="img" aria-label="見出しのスライド: 第2章 しくみ"><div class="m-slide-in"><div class="s-center"><span class="s-title">第2章 しくみ</span></div></div></div></template>
<template data-type="bullets"><div class="m-slide" role="img" aria-label="箇条書きのスライド: 困っていたこと"><div class="m-slide-in"><span class="s-h">困っていたこと</span><span class="s-lead">朝の5分で、今日の予定を<b>2人とも</b>知りたい。</span><ul class="s-list"><li>カレンダーが3つに分かれている</li><li>買い物のメモが<b>チャットに流れる</b></li><li>天気と予定を別々に見ている</li></ul></div></div></template>
<template data-type="diagram"><div class="m-slide is-diagram" role="img" aria-label="図のスライド: 朝のブリーフができるまで"><span class="s-note">構成図</span><div class="m-slide-in"><span class="s-h">朝のブリーフができるまで</span><span class="s-lead">6:50 に動いて、7:00 に届く。</span><div class="s-diagram"><span>カレンダー</span><i>→</i><span>Lambda</span><i>→</i><span>ブリーフ</span></div></div></div></template>
<template data-type="boxes"><div class="m-slide" role="img" aria-label="箱並びのスライド: 3つの置き場所"><div class="m-slide-in"><span class="s-h">3つの置き場所</span><span class="s-lead">中身の性質で置き場所を分ける。</span><div class="s-boxes"><div class="s-box"><strong>予定</strong>時刻があるもの</div><div class="s-box"><strong>タスク</strong>完了できるもの</div><div class="s-box"><strong>メモ</strong>あとで読むもの</div></div></div></div></template>
<template data-type="quote"><div class="m-slide" role="img" aria-label="引用のスライド: 決めたこと"><div class="m-slide-in"><span class="s-h">決めたこと</span><div class="s-quote">読み物はページにし、会話はチャットにする。</div><span class="s-lead">Muse DS の原則 1 より</span></div></div></template>
<template data-type="code"><div class="m-slide" role="img" aria-label="コードのスライド: 毎朝動かす"><div class="m-slide-in"><span class="s-h">毎朝動かす</span><div class="s-code">aws events put-rule \
  --name morning-brief \
  --schedule-expression "cron(50 21 * * ? *)"</div><ul class="s-list"><li>UTC で書くので 9 時間ずらす</li></ul></div></div></template>
<template data-type="number"><div class="m-slide" role="img" aria-label="大数字のスライド: 朝の確認 5分から1分"><div class="m-slide-in"><span class="s-h">朝の確認にかかる時間</span><span class="s-num">5分 → <b>1分</b></span><span class="s-lead">2人とも、平日の朝の平均（前の月との比較）</span></div></div></template>
<template data-type="end"><div class="m-slide" role="img" aria-label="終了のスライド: ありがとうございました"><div class="m-slide-in"><div class="s-center"><span class="s-title">ありがとうございました</span><span class="s-sub">資料は connpass のページに置きます</span></div></div></div></template>

<div class="demo-stage" data-demo="choice-button">
  <div class="demo-grid2">
    <div class="demo-item">
      <p class="demo-cap">縦並び（選んでから確定する）</p>
      <div class="m-options" role="radiogroup" aria-label="受け取り方法（見本）" style="max-width:420px">
        <button type="button" class="m-option" role="radio" aria-checked="false" tabindex="0">店頭で受け取る</button>
        <button type="button" class="m-option" role="radio" aria-checked="false" tabindex="-1">自宅に届ける</button>
        <button type="button" class="m-option" role="radio" aria-checked="false" tabindex="-1">宅配ボックスに届ける</button>
      </div>
    </div>
    <div class="demo-item">
      <p class="demo-cap">横並び（2択）</p>
      <div class="m-position" role="radiogroup" aria-label="追加する位置（見本）" style="max-width:420px;margin:0">
        <button type="button" role="radio" aria-checked="false" tabindex="-1">前に追加</button>
        <button type="button" role="radio" aria-checked="true" tabindex="0">後に追加</button>
      </div>
    </div>
    <div class="demo-item">
      <p class="demo-cap">状態の一覧（判定のあるとき）</p>
      <div class="m-options" style="max-width:420px">
        <button type="button" class="m-option" tabindex="-1">通常</button>
        <button type="button" class="m-option" aria-pressed="true" tabindex="-1">選択中</button>
        <button type="button" class="m-option is-correct" disabled>正解</button>
        <button type="button" class="m-option is-wrong" disabled>不正解</button>
      </div>
    </div>
  </div>
  <p class="demo-note">押すか ← → で選び直せます。正解・不正解は <code>--ok-soft</code>・<code>--danger-soft</code> の面と、✓ ✗ の印で示します。</p>
</div>
<div class="demo-stage" data-demo="quiz-option" style="margin-top:16px">
  <p class="demo-cap">クイズ（学習ノート）。選んで「答え合わせ」を押す</p>
  <div class="m-quiz" data-quiz data-answer="1" data-explain="主語が三人称単数（He）の現在の否定文は does not を使います。">
    <p class="m-quiz-q">「彼はコーヒーを飲みません」に合う英文は？</p>
    <div class="m-options">
      <button type="button" class="m-option" aria-pressed="false" aria-label="選択肢: He not drinks coffee.">He not drinks coffee.</button>
      <button type="button" class="m-option" aria-pressed="false" aria-label="選択肢: He doesn't drink coffee.">He doesn't drink coffee.</button>
      <button type="button" class="m-option" aria-pressed="false" aria-label="選択肢: He don't drink coffee.">He don't drink coffee.</button>
    </div>
    <button type="button" class="m-btn m-btn--primary" data-check>答え合わせ</button>
    <div data-out></div>
  </div>
  <div class="demo-item">
    <p class="demo-cap">状態の一覧</p>
    <div class="m-options" style="max-width:480px">
      <button type="button" class="m-option" tabindex="-1">通常</button>
      <button type="button" class="m-option" aria-pressed="true" tabindex="-1">選択中</button>
      <button type="button" class="m-option is-correct" disabled>正解</button>
      <button type="button" class="m-option is-wrong" disabled>不正解</button>
    </div>
  </div>
  <p class="demo-note">選んでから「答え合わせ」を押すと正誤が出ます。正解・不正解は <code>--ok-soft</code>・<code>--danger-soft</code> の面と、✓ ✗ の印で示します。</p>
</div>

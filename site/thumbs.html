<!-- 部品の一覧のカードに載せる小さな見本。部品の形だけを見せる。 -->
<template data-slug="button"><span class="m-btn m-btn--primary">続ける</span><span class="m-btn m-btn--secondary">あとで</span></template>
<template data-slug="chip-and-tag"><span class="m-chip">☀️ 14℃</span><span class="m-tag">サンプル</span></template>
<template data-slug="section-card"><div class="m-card"><div class="m-card-head" style="margin:0 0 8px"><span class="m-card-icon">📅</span><span class="th-col"><span class="th-line"></span></span></div><div class="th-col"><span class="th-line"></span><span class="th-line is-short"></span></div></div></template>
<template data-slug="list-rows"><div class="th-col" style="max-width:190px"><span class="demo-row" style="gap:8px;flex-wrap:nowrap"><span class="m-bar" style="background:var(--cal-common);min-height:22px"></span><span class="th-line" style="flex:1"></span></span><span class="demo-row" style="gap:8px;flex-wrap:nowrap"><span class="th-dot"></span><span class="th-line" style="flex:1"></span></span><span class="m-meter" style="margin:4px 0 0"><span style="width:56%"></span></span></div></template>
<template data-slug="input-and-switch"><div class="th-col"><span class="m-input" style="height:36px"></span><span class="m-switch" aria-checked="true" style="justify-self:end"></span></div></template>
<template data-slug="navigation"><span class="m-tabbar" style="padding:4px"><span style="width:40px;height:36px;border-radius:999px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)">{{i:home}}</span><span style="width:40px;height:36px;display:grid;place-items:center;color:var(--dim)">{{i:calendar}}</span><span style="width:40px;height:36px;display:grid;place-items:center;color:var(--dim)">{{i:book}}</span></span></template>
<template data-slug="approval-card"><div class="m-approval" style="padding:10px;width:100%"><div class="th-col" style="max-width:none"><span class="th-line"></span><span class="demo-row" style="gap:6px"><span class="th-line is-blue" style="width:48px;height:14px"></span><span class="th-line" style="width:48px;height:14px"></span></span></div></div></template>
<template data-slug="message-bubble"><div class="th-col" style="max-width:200px"><span class="m-bubble m-bubble--agent" style="padding:6px 12px;font-size:12px;justify-self:start">おはよう</span><span class="m-bubble m-bubble--user" style="padding:6px 12px;font-size:12px;justify-self:end">ありがとう</span></div></template>
<template data-slug="toast"><span class="m-toast is-static" style="font-size:12px;padding:8px 16px">コピーしました</span></template>
<template data-slug="done-toggle"><span class="m-done">{{i:check}}</span><span class="m-done is-badge">{{i:check}}</span></template>
<template data-slug="typing-indicator"><span class="m-typing" aria-hidden="true"><i></i><i></i><i></i></span><span class="m-typing is-neutral" aria-hidden="true"><i></i><i></i><i></i></span></template>
<template data-slug="speed-dial-fab"><span class="m-fab-main" style="position:relative">＋<span class="m-count-badge">2</span></span></template>
<template data-slug="memo-input-bar"><span class="m-memo-box" style="width:190px;justify-content:flex-end"><span class="m-send">{{i:up}}</span><span class="m-mic">{{i:mic}}</span></span></template>
<template data-slug="long-press-menu"><ul class="m-menu is-static" style="width:130px"><li><span style="display:flex;gap:6px;align-items:center;padding:3px 10px;font-size:12px">{{i:reply}}返信</span></li><li><span style="display:flex;gap:6px;align-items:center;padding:3px 10px;font-size:12px">{{i:copy}}コピー</span></li><li><span style="display:flex;gap:6px;align-items:center;padding:3px 10px;font-size:12px;color:var(--danger)">{{i:trash}}削除</span></li></ul></template>
<template data-slug="bottom-sheet"><div style="width:170px;height:78px;background:var(--scrim-strong);border-radius:8px;position:relative;overflow:hidden"><span style="position:absolute;left:10px;right:10px;bottom:0;height:52px;background:var(--surface);border-radius:14px 14px 0 0;padding:8px"><span class="th-line is-blue" style="display:block;margin-top:24px"></span></span></div></template>
<template data-slug="confirm-dialog"><div style="width:170px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;box-shadow:var(--shadow-float)"><span class="th-line" style="display:block"></span><span class="m-dialog-btns" style="margin-top:10px;gap:6px"><span style="height:20px;border-radius:8px;background:var(--fill);border:1px solid var(--border)"></span><span style="height:20px;border-radius:8px;background:var(--danger)"></span></span></div></template>
<template data-slug="flashcard"><div class="th-col" style="max-width:170px"><div class="m-word-card" style="padding:8px 12px"><span style="font-size:15px;font-weight:800">キャッシュ</span></div><span class="m-reveal" style="min-height:0;padding:6px;font-size:11px;text-align:center">タップして答えを見る</span></div></template>
<template data-slug="progress-path"><div class="th-col" style="max-width:150px"><span class="demo-row" style="flex-wrap:nowrap;gap:8px"><span class="th-dot" style="background:var(--ok);border-color:var(--ok)"></span><span class="th-line" style="flex:1"></span></span><span class="demo-row" style="flex-wrap:nowrap;gap:8px"><span class="th-dot" style="background:var(--accent);border-color:var(--accent)"></span><span class="th-line" style="flex:1"></span></span><span class="demo-row" style="flex-wrap:nowrap;gap:8px"><span class="th-dot"></span><span class="th-line is-short" style="flex:1"></span></span></div></template>
<template data-slug="media-card"><div style="width:130px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)"><span style="display:block;height:48px;background:var(--fill)"></span><span class="th-col" style="padding:6px 8px"><span class="th-line"></span><span class="th-line is-short"></span></span></div></template>
<template data-slug="status-list-item"><div class="m-thread" style="padding:10px;width:100%"><span class="m-badge-awaiting">{{i:chat}}</span><span class="th-col"><span class="th-line"></span><span class="th-line is-short"></span></span></div></template>
<template data-slug="icon-button"><span class="m-round">{{i:back}}</span><span class="m-round">{{i:refresh}}</span><span class="m-send">{{i:up}}</span></template>
<template data-slug="choice-button"><div class="th-col"><span class="m-option" style="min-height:0;padding:5px 10px;font-size:12px">店頭で受け取る</span><span class="m-option" style="min-height:0;padding:5px 10px;font-size:12px;border-color:var(--accent);background:var(--accent-soft)">自宅に届ける</span></div></template>
<template data-slug="skeleton"><div class="th-col" style="max-width:180px;gap:10px"><span class="demo-row" style="gap:8px;flex-wrap:nowrap"><span class="m-skel m-skel--circle"></span><span class="m-skel m-skel--line" style="flex:1"></span></span><span class="demo-row" style="gap:8px;flex-wrap:nowrap"><span class="m-skel m-skel--circle"></span><span class="m-skel m-skel--line is-short"></span></span></div></template>
<template data-slug="empty-state"><div class="th-col" style="justify-items:center;gap:6px"><span class="m-empty-icon" style="margin:0">{{i:inbox}}</span><span style="font-size:12px;font-weight:700">まだありません</span></div></template>
<template data-slug="search-field"><span class="m-search" style="width:170px;height:34px;pointer-events:none"><span class="m-search-icon">{{i:search}}</span><span style="font-size:12px;color:var(--faint)">検索</span></span></template>
<template data-slug="loading-states"><div class="th-col" style="max-width:190px"><span class="th-line"></span><span class="th-line is-short"></span><span class="m-tag" style="justify-self:start">0件 ・ 失敗</span></div></template>
<template data-slug="error-recovery"><div class="th-col" style="max-width:190px"><span class="m-input" style="height:30px"></span><span style="font-size:11px;color:var(--danger);font-weight:600">送れませんでした</span><span class="m-btn m-btn--primary" style="min-height:28px;font-size:11px;padding:0 12px;justify-self:start">もう一度送る</span></div></template>
<template data-slug="search-and-filter"><div class="th-col" style="max-width:190px"><span class="m-search" style="height:30px;min-height:0">{{i:search}}</span><span class="demo-row" style="gap:4px"><span class="m-chip" aria-pressed="true" style="min-height:22px;font-size:10px;padding:0 8px">すべて</span><span class="m-chip" style="min-height:22px;font-size:10px;padding:0 8px">果物</span></span></div></template>
<template data-slug="list-to-detail"><div class="demo-row" style="gap:6px;align-items:center"><span class="th-col" style="width:70px"><span class="th-line"></span><span class="th-line"></span><span class="th-line"></span></span><span style="color:var(--faint)">→</span><span class="m-card" style="width:80px;padding:8px"><span class="th-line is-short"></span></span></div></template>
<template data-slug="approval-flow"><div class="m-approval" style="padding:10px;width:100%"><div class="th-col" style="max-width:none"><span class="th-line"></span><span class="demo-row" style="gap:4px"><span class="m-btn m-btn--primary" style="min-height:24px;font-size:10px;padding:0 10px">許可</span><span class="m-btn m-btn--danger" style="min-height:24px;font-size:10px;padding:0 10px">拒否</span></span></div></div></template>

<div class="demo-stage" data-demo="request-row">
  <div class="demo-item">
    <p class="demo-cap">ページの下</p>
    <ul class="m-requests" style="padding:0">
      <li class="m-request"><span class="m-request-text"><span class="m-request-main">ページを追加（4ページの後）</span><span class="m-request-state">下書き</span></span><button type="button" class="m-done" aria-pressed="false" aria-label="完了にする" data-toggle-pressed data-labels="完了にする|未完了に戻す">{{i:check}}</button><button type="button" class="m-cancel" aria-label="この依頼を取り消す">×</button></li>
      <li class="m-request"><span class="m-request-text"><span class="m-request-main">このページを削除</span><span class="m-request-state">提出済み</span></span><button type="button" class="m-done" aria-pressed="false" aria-label="完了にする" data-toggle-pressed data-labels="完了にする|未完了に戻す">{{i:check}}</button></li>
      <li class="m-request"><span class="m-request-text"><span class="m-request-main">ページを追加（7ページの前）</span><span class="m-typing" role="status" style="margin-left:8px"><i></i><i></i><i></i><span class="vh">エージェントが修正中</span></span></span></li>
      <li class="m-request is-done"><span class="m-request-text"><span class="m-request-main">ページを追加（2ページの後）</span></span><button type="button" class="m-done" aria-pressed="true" aria-label="未完了に戻す" data-toggle-pressed data-labels="完了にする|未完了に戻す">{{i:check}}</button></li>
    </ul>
  </div>
  <div class="demo-item">
    <p class="demo-cap">シートの中</p>
    <ul class="m-requests" style="padding:0;background:var(--surface);padding:12px;border-radius:var(--radius-card)">
      <li class="m-request is-in-sheet"><span class="m-request-text"><span class="m-request-main">ページを追加（もとは12ページの後）</span><span class="m-request-state">提出済み</span></span><button type="button" class="m-done" aria-pressed="false" aria-label="完了にする" data-toggle-pressed data-labels="完了にする|未完了に戻す">{{i:check}}</button></li>
    </ul>
  </div>
  <p class="demo-note">上から 下書き・提出済み・修正中・完了。完了トグルで完了の見た目に、× で取り消せます。</p>
</div>

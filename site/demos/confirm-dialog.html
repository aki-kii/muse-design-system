<div class="demo-stage" data-demo="confirm-dialog">
  <div class="m-modal-area" style="min-height:300px">
    <div style="padding:16px;display:grid;gap:10px;justify-items:start">
      <div class="m-card" style="width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px">
        <button type="button" class="m-round" aria-label="一覧に戻る">{{i:back}}</button>
        <span style="flex:1;font-weight:700">旅行の写真</span>
        <button type="button" class="m-round" style="color:var(--danger)" aria-label="フォルダを削除" data-open>{{i:trash}}</button>
      </div>
      <div data-list hidden><p class="demo-note">フォルダを削除して一覧に戻りました。<button type="button" class="demo-reset" data-reset>はじめに戻す</button></p></div>
    </div>
    <div data-layer hidden>
      <div class="m-backdrop is-heavy"></div>
      <div class="m-dialog" role="alertdialog" aria-modal="true" aria-labelledby="cd-t" aria-describedby="cd-d">
        <p class="m-dialog-title" id="cd-t">フォルダを削除しますか？</p>
        <p class="m-dialog-sub" id="cd-d">中の項目もすべて削除されます</p>
        <div class="m-dialog-btns"><button type="button" class="m-dialog-cancel">やめる</button><button type="button" class="m-dialog-ok">削除する</button></div>
      </div>
    </div>
  </div>
  <p class="demo-note">ゴミ箱を押すとダイアログが開きます。フォーカスは「やめる」に置き、Esc でも閉じます。後ろは幕ではなく <code>--bg</code> の面で覆い、「削除する」は <code>--danger</code> の面に <code>--danger-ink</code> の文字です。</p>
</div>

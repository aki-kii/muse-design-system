<div class="demo-stage" data-demo="input-and-switch">
  <div class="demo-item">
    <p class="demo-cap">入力欄（空のまま欄を離れるとエラーの状態）</p>
    <div class="m-field" data-validate="表示名を入れてください。例: さくら">
      <label class="m-label" for="ip-1">表示名</label>
      <input class="m-input" id="ip-1" type="text" placeholder="例: さくら" aria-describedby="ip-1-h">
      <p class="m-hint" id="ip-1-h">ほかの人に見える名前です</p>
    </div>
  </div>
  <div class="demo-item">
    <p class="demo-cap">形の確認（@ の後ろまで入れずに欄を離れるとエラーの状態）</p>
    <div class="m-field" data-validate-email="@ の後ろまで入れてください。例: name@example.com">
      <label class="m-label" for="ip-2">メールアドレス</label>
      <input class="m-input" id="ip-2" type="email" placeholder="例: name@example.com" autocomplete="off" aria-describedby="ip-2-h">
      <p class="m-hint" id="ip-2-h">お知らせを受け取るアドレスです</p>
    </div>
  </div>
  <div class="demo-item">
    <p class="demo-cap">スイッチの行（行全体が押せる）</p>
    <div class="m-switch-row" data-name="朝のお知らせ">
      <span class="m-switch-text"><span class="m-switch-title" id="sw-1">朝のお知らせ</span><span class="m-switch-sub">毎朝 7:00 に通知する</span></span>
      <button type="button" class="m-switch" role="switch" aria-checked="true" aria-labelledby="sw-1"></button>
    </div>
    <div class="m-switch-row" data-name="通知">
      <span class="m-switch-text"><span class="m-switch-title" id="sw-2">通知</span><span class="m-switch-sub">承認が要るときに知らせる</span></span>
      <button type="button" class="m-switch" role="switch" aria-checked="false" aria-labelledby="sw-2"></button>
    </div>
  </div>
</div>

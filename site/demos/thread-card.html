<div class="demo-stage" data-demo="thread-card">
  <div class="demo-phone">
    <ul class="m-threads" aria-label="スレッドの一覧（見本）">
      <li><button type="button" class="m-thread is-working" aria-label="グラフの色をデッキに合わせて（エージェントが修正中）">
        <span class="m-thread-body"><span class="m-thread-title-row"><span class="m-thread-title">グラフの色をデッキに合わせて</span><span class="m-thread-count">3件</span></span><span class="m-thread-last">アシスタント: 3色に揃えます</span><span class="m-thread-foot">10:21<span class="m-typing" role="status"><i></i><i></i><i></i><span class="vh">エージェントが修正中</span></span></span></span>
      </button></li>
      <li><button type="button" class="m-thread" aria-label="タイトルをもう少し短くしたい（確認待ち）">
        <span class="m-badge-awaiting" aria-hidden="true">{{i:chat}}</span>
        <span class="m-thread-body"><span class="m-thread-title-row"><span class="m-thread-title">タイトルをもう少し短くしたい</span><span class="m-thread-count">2件</span></span><span class="m-thread-last">アシスタント: 「週末の読書会のふりかえり」にしました</span><span class="m-thread-foot">10:05</span></span>
      </button></li>
      <li><button type="button" class="m-thread" aria-label="発表者の名前を入れる（下書き1件）">
        <span class="m-thread-body"><span class="m-thread-title-row"><span class="m-thread-title">発表者の名前を入れる</span><span class="m-thread-count">1件</span></span><span class="m-thread-last">右下に小さく入れたい</span><span class="m-thread-foot">9:48<span class="m-thread-draft">下書き1件</span></span></span>
      </button></li>
      <li><button type="button" class="m-thread is-thin" aria-label="解決済み: 誤字を直す">
        <span class="m-done is-badge" aria-hidden="true">{{i:check}}</span><span class="m-thread-title">誤字を直す</span>
      </button></li>
    </ul>
  </div>
  <p class="demo-note">上から 修正中・確認待ち・下書きあり・解決済み（細い）の順です。</p>
</div>

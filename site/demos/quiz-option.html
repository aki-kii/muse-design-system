<div class="demo-stage" data-demo="quiz-option">
  <div class="m-quiz" data-quiz data-answer="1" data-explain="主語が三人称単数（He）の現在の否定文は does not を使います。">
    <p class="m-quiz-q">「彼はコーヒーを飲みません」に合う英文は？</p>
    <div class="m-options">
      <button type="button" class="m-option" aria-pressed="false" aria-label="選択肢: He not drinks coffee.">He not drinks coffee.</button>
      <button type="button" class="m-option" aria-pressed="false" aria-label="選択肢: He doesn't drink coffee.">He doesn't drink coffee.</button>
      <button type="button" class="m-option" aria-pressed="false" aria-label="選択肢: He don't drink coffee.">He don't drink coffee.</button>
    </div>
    <button type="button" class="m-btn m-btn--primary" data-check>答え合わせ</button>
    <div data-out></div>
  </div>
  <div class="demo-item">
    <p class="demo-cap">状態の一覧</p>
    <div class="m-options" style="max-width:480px">
      <button type="button" class="m-option" tabindex="-1">通常</button>
      <button type="button" class="m-option" aria-pressed="true" tabindex="-1">選択中</button>
      <button type="button" class="m-option is-correct" disabled>正解</button>
      <button type="button" class="m-option is-wrong" disabled>不正解</button>
    </div>
  </div>
  <p class="demo-note">選んでから「答え合わせ」を押すと正誤が出ます。正解・不正解の薄い面はトークンが未定義のため（判断待ちの点 12）、モックの値で表示しています。</p>
</div>

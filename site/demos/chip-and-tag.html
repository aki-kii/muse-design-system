<div class="demo-stage" data-demo="chip-and-tag">
  <div class="demo-item">
    <p class="demo-cap">チップ（押すと選択中に切り替わる）</p>
    <div class="m-chips">
      <button type="button" class="m-chip" aria-pressed="false" data-toggle-pressed><span aria-hidden="true">☀️</span>東京・晴れのち曇り 14℃</button>
      <button type="button" class="m-chip" aria-pressed="true" data-toggle-pressed><span aria-hidden="true">🌙</span>睡眠 6時間40分</button>
      <button type="button" class="m-chip" aria-pressed="false" data-toggle-pressed>今週</button>
    </div>
  </div>
  <div class="demo-item">
    <p class="demo-cap">チップ（枠線）: <code>--fill</code> の面の上</p>
    <div class="m-chips" style="background:var(--fill);padding:12px;border-radius:var(--radius-row)">
      <button type="button" class="m-chip m-chip--outline" aria-pressed="false" data-toggle-pressed>すべて</button>
      <button type="button" class="m-chip m-chip--outline" aria-pressed="false" data-toggle-pressed>仕事</button>
    </div>
  </div>
  <div class="demo-item">
    <p class="demo-cap">タグ（押せない）</p>
    <div class="m-chips"><span class="m-tag">仕事</span><span class="m-tag">サンプル</span><span class="m-tag">締切 12/23</span></div>
  </div>
</div>

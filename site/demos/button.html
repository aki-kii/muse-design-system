<div class="demo-stage" data-demo="button">
  <div class="demo-item">
    <p class="demo-cap">バリアント</p>
    <div class="m-btn-row">
      <button type="button" class="m-btn m-btn--primary" data-toast="続けます">続ける</button>
      <button type="button" class="m-btn m-btn--secondary" data-toast="あとにしました">あとで</button>
      <a class="m-btn m-btn--ghost" href="#バリアント">詳しく見る</a>
      <button type="button" class="m-btn m-btn--danger" data-toast="削除しました">削除</button>
    </div>
  </div>
  <div class="demo-item">
    <p class="demo-cap">状態（プライマリ）</p>
    <div class="m-btn-row">
      <span class="demo-col"><button type="button" class="m-btn m-btn--primary">続ける</button><span class="demo-note">通常</span></span>
      <span class="demo-col"><button type="button" class="m-btn m-btn--primary is-pressed" tabindex="-1">続ける</button><span class="demo-note">押下</span></span>
      <span class="demo-col"><button type="button" class="m-btn m-btn--primary" disabled>送信</button><span class="demo-note">無効</span></span>
      <span class="demo-col"><button type="button" class="m-btn m-btn--primary is-focus" tabindex="-1">続ける</button><span class="demo-note">フォーカス</span></span>
    </div>
  </div>
  <p class="demo-note">押すと結果をトーストで知らせます。Tab キーでフォーカスの輪も確かめられます。</p>
</div>

<div class="demo-stage" data-demo="media-card">
  <div class="demo-grid2">
    <div class="demo-item">
      <p class="demo-cap">大（サムネイル＋タイトル＋件数・日付）</p>
      <ul class="m-decks" style="list-style:none;margin:0;padding:0" aria-label="資料の一覧（見本）">
        <li><button type="button" class="m-deck" aria-label="週末の読書会のふりかえり・12枚・11月8日" data-toast="開きます">
          <div class="m-deck-thumb" aria-hidden="true">{{slide:cover}}</div>
          <div class="m-deck-meta"><span class="m-deck-title">週末の読書会のふりかえり</span><span class="m-deck-info"><span>12枚</span><span>11月8日</span></span></div>
        </button></li>
        <li><button type="button" class="m-deck" aria-label="新しい資料・サムネイルなし・3枚・11月14日" data-toast="開きます">
          <div class="m-deck-thumb is-empty" aria-hidden="true">新しい資料</div>
          <div class="m-deck-meta"><span class="m-deck-title">新しい資料</span><span class="m-deck-info"><span>3枚</span><span>11月14日</span></span></div>
        </button></li>
      </ul>
    </div>
    <div class="demo-item">
      <p class="demo-cap">小（表紙＋タイトル＋進捗バー）</p>
      <div class="m-shelf">
        <button type="button" class="m-cover" aria-label="はじめての写真整理・60%" data-toast="開きます">
          <span class="m-cover-face" style="background:var(--demo-course-1)" aria-hidden="true">{{i:book}}</span>
          <span class="m-cover-body"><span class="m-cover-title">はじめての写真整理</span><span class="m-cover-bar"><span style="width:60%"></span></span></span>
        </button>
        <button type="button" class="m-cover" aria-label="作り置きのレシピ・25%" data-toast="開きます">
          <span class="m-cover-face" style="background:var(--demo-course-2)" aria-hidden="true">{{i:box}}</span>
          <span class="m-cover-body"><span class="m-cover-title">作り置きのレシピ</span><span class="m-cover-bar"><span style="width:25%"></span></span></span>
        </button>
      </div>
    </div>
  </div>
  <p class="demo-note">中身は架空です。サムネイルや表紙の色は中身側の色で、DS のトークンでは塗りません。</p>
</div>
<div class="demo-stage" data-demo="shelf-cover-card" style="margin-top:16px">
  <p class="demo-cap">本棚（学習ノート）</p>
  <div class="m-shelf">
    <button type="button" class="m-cover" aria-label="TCP/IP のきほんを開く・あと 8 ページ" data-toast="ノートを開きます">
      <span class="m-cover-face" style="background:var(--demo-course-1)" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path d="M5 16v-4h14v4"/><path d="M12 12V8"/></svg></span>
      <span class="m-cover-body"><span class="m-cover-title">TCP/IP のきほん</span><span class="m-cover-bar"><span style="width:60%"></span></span></span>
    </button>
    <button type="button" class="m-cover" aria-label="インデックスの仕組みを開く・あと 15 ページ" data-toast="ノートを開きます">
      <span class="m-cover-face" style="background:var(--demo-course-2)" aria-hidden="true"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg></span>
      <span class="m-cover-body"><span class="m-cover-title">インデックスの仕組み</span><span class="m-cover-bar"><span style="width:25%"></span></span></span>
    </button>
    <p class="m-shelf-sep" aria-hidden="true">★</p>
    <button type="button" class="m-cover" aria-label="コンテナとイメージを開く・読み終えた" data-toast="ノートを開きます">
      <span class="m-cover-face" style="background:var(--demo-course-5)" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg><span class="m-cover-star">★</span></span>
      <span class="m-cover-body"><span class="m-cover-title">コンテナとイメージ</span><span class="m-cover-bar"><span style="width:100%"></span></span></span>
    </button>
    <button type="button" class="m-cover" aria-label="型のある言語を開く・読み終えた" data-toast="ノートを開きます">
      <span class="m-cover-face" style="background:var(--demo-course-4)" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg><span class="m-cover-star">★</span></span>
      <span class="m-cover-body"><span class="m-cover-title">型のある言語</span><span class="m-cover-bar"><span style="width:100%"></span></span></span>
    </button>
  </div>
  <p class="demo-note">読みかけ2冊と、区切りの下に読み終えた2冊を並べています。表紙の色は中身側の色の例、区切りの ★ は <code>--gold</code> の飾りです。</p>
</div>

<div class="demo-stage" data-demo="progress-path">
  <div class="m-path">
    <section aria-label="はじめての家計簿">
      <p class="m-unit" style="margin-top:0">ステップ 1 準備</p>
      <ol class="m-nodes">
        <li><button type="button" class="m-node is-done" aria-label="口座を登録する・完了"><span class="m-node-dot" aria-hidden="true">✓</span><span class="m-node-text"><span class="m-node-title">口座を登録する</span><span class="m-node-state">完了</span></span></button></li>
        <li><button type="button" class="m-node is-current" aria-label="費目を決める・次はここ"><span class="m-node-dot" aria-hidden="true">▶</span><span class="m-node-text"><span class="m-node-title">費目を決める</span><span class="m-node-state">次はここ</span></span></button></li>
      </ol>
      <p class="m-unit">ステップ 2 記録</p>
      <ol class="m-nodes">
        <li><button type="button" class="m-node is-doing" aria-label="1週間つけてみる・途中"><span class="m-node-dot" aria-hidden="true">▶</span><span class="m-node-text"><span class="m-node-title">1週間つけてみる</span><span class="m-node-state">途中</span></span></button></li>
        <li><div class="m-node is-locked" aria-label="月の予算を立てるはまだ先"><span class="m-node-dot" aria-hidden="true">・</span><span class="m-node-text"><span class="m-node-title">月の予算を立てる</span></span></div></li>
      </ol>
    </section>
  </div>
  <p class="demo-note">完了・現在・途中・未開放の4つの状態です（架空の手順）。押せるノードを押すとトーストで知らせます。完了の円は <code>--gold</code> の面に <code>--gold-ink</code> の印です。</p>
</div>

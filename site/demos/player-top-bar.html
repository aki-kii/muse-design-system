<div class="demo-stage" data-demo="player-top-bar">
  <div class="m-player-bar m-card">
    <div class="m-player-row">
      <button type="button" class="m-x" aria-label="ホームに戻る" data-toast="ホームに戻ります">✕</button>
      <div class="m-track" role="progressbar" aria-label="今の章の進み具合" aria-valuemin="0" aria-valuemax="7" aria-valuenow="3"><span style="width:43%"></span></div>
      <span class="m-combo">×1</span>
      <span class="m-xp">XP 120</span>
    </div>
    <p class="m-player-pos">英文法の基礎 · 疑問文と否定文 · 3/7</p>
  </div>
  <div class="m-btn-row">
    <button type="button" class="m-btn m-btn--secondary" data-right>正解して進む</button>
    <button type="button" class="m-btn m-btn--secondary" data-wrong>間違えて進む</button>
    <button type="button" class="demo-reset" data-reset>はじめに戻す</button>
  </div>
  <p class="demo-note">コンボが2以上になると「×n」がブルーになります。XP の金色はトークンが未定義のため（判断待ちの点 11）、モックの値で表示しています。</p>
</div>

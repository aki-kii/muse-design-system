<div class="demo-stage" data-demo="typing-strip">
  <div class="demo-phone">
    <div class="m-composer">
      <div class="m-strip" data-strip><span class="m-typing is-neutral" role="status"><i></i><i></i><i></i><span class="vh">エージェントが修正中</span></span></div>
      <label class="vh" for="memo-typing-strip-1">メモを入力</label><div class="m-memo-box"><textarea class="m-memo-input" rows="1" placeholder="メモを書く" id="memo-typing-strip-1"></textarea><span class="m-memo-btns"><button type="button" class="m-mic" aria-pressed="false" aria-label="音声入力">{{i:mic}}</button></span></div>
    </div>
  </div>
  <div class="m-btn-row">
    <button type="button" class="m-btn m-btn--secondary" data-working>修正中にする</button>
    <button type="button" class="m-btn m-btn--secondary" data-copy>コピーの結果を出す</button>
    <button type="button" class="demo-reset" data-hide>帯を消す</button>
  </div>
</div>

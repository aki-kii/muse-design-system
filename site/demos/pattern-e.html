<div class="sample demo">
  <p class="sample-label">見本: 9つの型（比 980:552、寸法はスライドの幅に対する割合）</p>
  <div class="m-slide-types">
    <figure>{{slide:cover}}<figcaption>表紙</figcaption></figure>
    <figure>{{slide:section}}<figcaption>見出し（中扉）</figcaption></figure>
    <figure>{{slide:bullets}}<figcaption>箇条書き</figcaption></figure>
    <figure>{{slide:diagram}}<figcaption>図</figcaption></figure>
    <figure>{{slide:boxes}}<figcaption>箱並び</figcaption></figure>
    <figure>{{slide:quote}}<figcaption>引用</figcaption></figure>
    <figure>{{slide:code}}<figcaption>コード</figcaption></figure>
    <figure>{{slide:number}}<figcaption>大数字</figcaption></figure>
    <figure>{{slide:end}}<figcaption>終了</figcaption></figure>
  </div>
  <p class="demo-note" style="margin-top:10px">スライドの中の色はデッキ側の色（中身側の色）で、DS のトークンではありません。</p>
</div>

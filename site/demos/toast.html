<div class="demo-stage" data-demo="toast">
  <div class="m-btn-row">
    <button type="button" class="m-btn m-btn--secondary" data-show-toast="コピーしました">コピーする</button>
    <button type="button" class="m-btn m-btn--secondary" data-show-toast="保存しました">保存する</button>
    <button type="button" class="m-btn m-btn--secondary" data-show-toast="ダークに切り替えました">切り替える</button>
  </div>
  <div class="demo-item">
    <p class="demo-cap">表示中の見た目（押すと画面下の中央に約 2.2 秒出ます）</p>
    <div><span class="m-toast is-static">コピーしました</span></div>
  </div>
</div>
<div class="demo-stage" data-demo="submit-message" style="margin-top:16px">
  <p class="demo-cap">件数（スライドエディタ）。FAB から修正依頼を出す</p>
  <div class="demo-item">
    <p class="demo-cap">表示中の見た目</p>
    <div><span class="m-submit is-static">修正依頼を 3 件出しました（メモ2件・ページ依頼1件）</span></div>
  </div>
  <div class="m-fab-area" style="min-height:320px">
    <div class="m-fab" data-fab data-drafts="3">
      <div data-msg style="display:flex;justify-content:flex-end"></div>
      <ul class="m-fab-items" hidden>
        <li><button type="button" class="m-fab-item"><span class="m-fab-label">スレッドを追加</span><span class="m-fab-icon">{{i:msgPlus}}</span></button></li>
        <li><button type="button" class="m-fab-item"><span class="m-fab-label">ページを追加</span><span class="m-fab-icon">{{i:filePlus}}</span></button></li>
        <li><button type="button" class="m-fab-item"><span class="m-fab-label">ページを削除</span><span class="m-fab-icon">{{i:fileMinus}}</span></button></li>
        <li><button type="button" class="m-fab-item" data-submit><span class="m-fab-label">修正依頼</span><span class="m-fab-icon">{{i:sendAll}}<span class="m-count-badge" aria-hidden="true">3</span></span></button></li>
      </ul>
      <button type="button" class="m-fab-main" aria-expanded="false" aria-label="メニューを開く">＋</button>
    </div>
  </div>
  <p class="demo-note">＋ →「修正依頼」で、FAB の上に約 4 秒出ます。</p>
</div>
